<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像詳細 - みんなのキッチン</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">

        <!-- ヘッダー（戻るボタン） -->
        <header class="detail-header">
            <!-- hrefの中身をJavaScriptの履歴を戻る命令に変更 -->
            <a href="javascript:history.back();" class="back-button">
                <i class="fa-solid fa-chevron-left"></i> 戻る
            </a>
        </header>

        <!-- メイン画像とピンのコンテナ -->
        <main class="detail-content">
            <!-- ピンを配置するための基準となる枠 -->
            <div class="image-wrap">
                <!-- 詳細用の画像（srcを空にして、直後のスクリプトで即座に設定） -->
                <img id="detailImage" alt="キッチン詳細画像" class="detail-image">
                <script>
                    // 画面の読み込み完了を待たずに、最速で画像URLを適用する
                    (function () {
                        const urlParams = new URLSearchParams(window.location.search);
                        const targetImg = urlParams.get('img') || 'kitchen1.jpg'; // パラメータがない場合はkitchen1にする
                        document.getElementById('detailImage').src = `./images/${targetImg}`;
                    })();
                </script>

                <!-- 商品ピンに data-product-id を使用 -->
                <div class="item-pin" data-product-id="pan" style="top: 36.7%; left: 66.6%;"></div>
                <div class="item-pin" data-product-id="rack" style="top: 34.4%; left: 3.5%;"></div>
                <div class="item-pin" data-product-id="kettle" style="top: 71.2%; left: 64.5%;"></div>
            </div>
        </main>

        <!-- ========== ポップアップ画面 ========== -->
        <!-- 背景を暗くするフィルター -->
        <div class="overlay" id="overlay"></div>

        <!-- 下から出てくる商品詳細（ボトムシート） -->
        <div class="product-modal" id="productModal">
            <!-- スマホアプリっぽい上部のグレーのバー -->
            <div class="modal-handle"></div>

            <!-- 閉じるボタン -->
            <button class="close-btn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button>

            <!-- 商品情報の中身（ここはJSで上書きされますが、初期値として残しておきます） -->
            <div class="product-info">
                <img src="./images/kitchen1.jpg" alt="商品画像" class="product-img">
                <div class="product-details">
                    <h3 class="product-name">IH・ガス火 軽量フライパン</h3>
                    <p class="product-price">1,990円<span>（税込）</span></p>
                </div>
            </div>

            <button class="cart-add-btn">カートに入れる</button>
        </div>
        <!-- ==================================== -->

        <!-- まとめてカートに入れるボタン（画面下部固定） -->
        <div class="bottom-action">
            <button class="cart-add-btn">この写真のアイテムをまとめてカートに入れる</button>
        </div>

    </div>


    <script>
        // async を追加して、非同期処理（JSONの読み込み）ができるようにしています
        document.addEventListener('DOMContentLoaded', async () => {







            // -----------------------------------------------------------
            // 開発用・座標取得ツール（元のまま残しています）
            // -----------------------------------------------------------
            const image = document.querySelector('.detail-image');

            image.addEventListener('click', (e) => {
                const rect = image.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const percentX = (x / rect.width * 100).toFixed(1);
                const percentY = (y / rect.height * 100).toFixed(1);

                // コピーするコードにも data-product-id が入るように少し改良しました
                const pinCode = `<div class="item-pin" data-product-id="IDを入力" style="top: ${percentY}%; left: ${percentX}%;"></div>`;

                alert(`【座標を取得しました！】\n\n上から (top): ${percentY}%\n左から (left): ${percentX}%\n\n▼以下のコードをコピーしてHTMLに貼り付けてください▼\n${pinCode}`);
                console.log(pinCode);
            });

            // -----------------------------------------------------------
            // ② JSONの読み込みとポップアップの開閉処理
            // -----------------------------------------------------------
            const pins = document.querySelectorAll('.item-pin');
            const modal = document.getElementById('productModal');
            const overlay = document.getElementById('overlay');
            const closeBtn = document.getElementById('closeBtn');

            // モーダル内の要素を取得
            const modalImg = modal.querySelector('.product-img');
            const modalName = modal.querySelector('.product-name');
            const modalPrice = modal.querySelector('.product-price');
            const buyButton = modal.querySelector('.cart-add-btn');

            let productsData = {};

            // JSON データを取得する
            try {
                const response = await fetch('products.json');
                productsData = await response.json();
            } catch (error) {
                console.error('JSONデータの読み込みに失敗しました:', error);
            }

            // 全てのピンに対して、クリックされたらポップアップを開く設定をする
            pins.forEach(pin => {
                pin.addEventListener('click', (e) => {
                    // 追加：ピンを押した時に、背後の画像のクリック判定（座標取得ツール）が反応しないようにブロックします
                    e.stopPropagation();

                    // どのピンが押されたか（pan, rack, kettle 等）を取得
                    const productId = pin.getAttribute('data-product-id');
                    // 取得したIDを使ってJSONデータから商品情報を引き出す
                    const product = productsData[productId];

                    if (product) {
                        // JSONから取得したデータをモーダルのHTMLに流し込む
                        modalImg.src = product.image;
                        modalName.textContent = product.name;
                        modalPrice.innerHTML = `${product.price}<span>（税込）</span>`;
                        buyButton.onclick = () => {
                            // target="_blank" と同じように新しいタブで本物のニトリネットを開く
                            window.open(product.url, '_blank');
                        };
                    }

                    // モーダルを開く
                    modal.classList.add('active');
                    overlay.classList.add('active');
                });
            });

            // ポップアップを閉じる処理
            const closeModal = () => {
                modal.classList.remove('active');
                overlay.classList.remove('active');
            };

            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', closeModal);
        });
    </script>
</body>

</html>
