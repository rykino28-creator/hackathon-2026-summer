<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像詳細 - みんなのキッチン</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <header class="detail-header">
            <a href="index.html" class="back-button">
                <i class="fa-solid fa-chevron-left"></i> 戻る
            </a>
        </header>

        <main class="detail-content">
            <div class="image-wrap">
                <img id="detailImage" alt="キッチン詳細画像" class="detail-image">
            </div>

            <div class="post-details">
                <section class="related-products" aria-labelledby="relatedProductsTitle">
                    <h2 id="relatedProductsTitle">写真に写っている商品</h2>
                    <div class="product-strip" id="relatedProducts"></div>
                </section>

                <button id="detailFavoriteButton" class="detail-favorite-button" type="button"></button>

                <section class="post-tags" aria-labelledby="postTagsTitle">
                    <h2 id="postTagsTitle">この投稿のタグ</h2>
                    <div class="tag-list" id="postTags"></div>
                </section>

                <section class="post-description" aria-labelledby="postDescriptionTitle">
                    <h2 id="postDescriptionTitle">投稿者からの説明</h2>
                    <p id="postDescription"></p>
                </section>
            </div>
        </main>

        <div class="overlay" id="overlay"></div>

        <div class="product-modal" id="productModal" role="dialog" aria-modal="true" aria-label="商品情報">
            <div class="modal-handle"></div>
            <button class="close-btn" id="closeBtn" aria-label="商品情報を閉じる">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="product-modal-title" id="productModalTitle">商品候補</h2>
            <div class="product-options" id="productOptions"></div>
        </div>

        <div class="selection-panel" id="selectionPanel">
            <div class="selected-products" id="selectedProducts"></div>
            <button class="selection-summary" id="selectionSummary" type="button" aria-expanded="false">
                <span><strong id="selectedCount">0点</strong>を選択中</span>
                <span class="selected-total" id="selectedTotal">合計 0円</span>
                <span class="selection-chevron" id="selectionChevron" aria-hidden="true">⌃</span>
            </button>
            <button class="checkout-button" id="checkoutButton" type="button" disabled>カートに追加</button>
        </div>
    </div>

    <script type="module" src="./src/detail.js"></script>
</body>

</html>
