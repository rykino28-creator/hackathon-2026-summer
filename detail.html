<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像詳細 - みんなのキッチン</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <header class="detail-header">
            <a href="index.html" class="back-button">
                <i class="fa-solid fa-chevron-left"></i> 戻る
            </a>
        </header>

        <main class="detail-content">
            <div class="image-wrap">
                <img id="detailImage" alt="キッチン詳細画像" class="detail-image">
            </div>

            <div class="post-details">
                <section class="related-products" aria-labelledby="relatedProductsTitle">
                    <h2 id="relatedProductsTitle">写真に写っている商品</h2>
                    <div class="product-strip" id="relatedProducts"></div>
                </section>

                <button id="detailFavoriteButton" class="detail-favorite-button" type="button"></button>

                <section class="post-tags" aria-labelledby="postTagsTitle">
                    <h2 id="postTagsTitle">この投稿のタグ</h2>
                    <div class="tag-list" id="postTags"></div>
                </section>

                <section class="post-description" aria-labelledby="postDescriptionTitle">
                    <h2 id="postDescriptionTitle">投稿者からの説明</h2>
                    <p id="postDescription"></p>
                </section>
            </div>
        </main>

        <div class="overlay" id="overlay"></div>

        <div class="product-modal" id="productModal" role="dialog" aria-modal="true" aria-label="商品情報">
            <div class="modal-handle"></div>
            <button class="close-btn" id="closeBtn" aria-label="商品情報を閉じる">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="product-info">
                <img src="./images/item-temp-thumbnail.png" alt="商品画像" class="product-img">
                <div class="product-details">
                    <h3 class="product-name">商品名</h3>
                    <p class="product-price">価格<span>（税込）</span></p>
                </div>
            </div>

            <button class="cart-add-btn">カートに入れる</button>
        </div>

        <div class="bottom-action">
            <button class="cart-add-btn">この写真のアイテムをまとめてカートに入れる</button>
        </div>
    </div>

    <script type="module" src="./src/detail.js"></script>
</body>

</html>
