<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像詳細 - みんなのキッチン</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">

        <!-- ヘッダー（戻るボタン） -->
        <header class="detail-header">
            <a href="index.html" class="back-button">
                <i class="fa-solid fa-chevron-left"></i> 戻る
            </a>
        </header>

        <!-- メイン画像とピンのコンテナ -->
        <main class="detail-content">
            <!-- ピンを配置するための基準となる枠 -->
            <div class="image-wrap">
                <!-- 詳細用の画像（アスペクト比を維持して全幅表示） -->
                <img src="./images/kitchen1.jpg" alt="キッチン詳細画像" class="detail-image">

                <!-- 商品ピン（styleで上から〇%、左から〇%という座標を指定） -->
                <div class="item-pin" style="top: 36.7%; left: 66.6%;"></div>
                <div class="item-pin" style="top: 29.8%; left: 50.8%;"></div>
                <div class="item-pin" style="top: 34.1%; left: 3.3%;"> </div>
            </div>
        </main>

        <!-- まとめてカートに入れるボタン（画面下部固定） -->

        <!-- ========== ここから追加（ポップアップ画面） ========== -->
        <!-- 背景を暗くするフィルター -->
        <div class="overlay" id="overlay"></div>

        <!-- 下から出てくる商品詳細（ボトムシート） -->
        <div class="product-modal" id="productModal">
            <!-- スマホアプリっぽい上部のグレーのバー -->
            <div class="modal-handle"></div>

            <!-- 閉じるボタン -->
            <button class="close-btn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button>

            <!-- 商品情報の中身 -->
            <div class="product-info">
                <img src="./images/kitchen1.jpg" alt="商品画像" class="product-img">
                <div class="product-details">
                    <h3 class="product-name">IH・ガス火 軽量フライパン</h3>
                    <p class="product-price">1,990円<span>（税込）</span></p>
                </div>
            </div>

            <button class="cart-add-btn">カートに入れる</button>
        </div>
        <!-- ========== ここまで追加 ========== -->

        <div class="bottom-action">
            <button class="cart-add-btn">この写真のアイテムをまとめてカートに入れる</button>
        </div>

    </div>







    <script>
        // 開発用・座標取得ツール（本番では消してもOK）
        document.addEventListener('DOMContentLoaded', () => {
            const image = document.querySelector('.detail-image');

            image.addEventListener('click', (e) => {
                // 画像の実際のサイズと画面上の位置を取得
                const rect = image.getBoundingClientRect();

                // クリックした場所のX座標、Y座標を計算
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // パーセント（%）に変換して、小数点第1位で丸める
                const percentX = (x / rect.width * 100).toFixed(1);
                const percentY = (y / rect.height * 100).toFixed(1);

                // そのままコピペできるHTMLコードを作成
                const pinCode = `<div class="item-pin" style="top: ${percentY}%; left: ${percentX}%;"></div>`;

                // アラートで表示
                alert(`【座標を取得しました！】\n\n上から (top): ${percentY}%\n左から (left): ${percentX}%\n\n▼以下のコードをコピーしてHTMLに貼り付けてください▼\n${pinCode}`);

                // コンソールにも出力（F12キーで開く開発者ツールで見れます）
                console.log(pinCode);
            });
            // ========== ここから追加（ポップアップの開閉処理） ==========
            const pins = document.querySelectorAll('.item-pin');
            const modal = document.getElementById('productModal');
            const overlay = document.getElementById('overlay');
            const closeBtn = document.getElementById('closeBtn');

            // 全てのピンに対して、クリックされたらポップアップを開く設定をする
            pins.forEach(pin => {
                pin.addEventListener('click', () => {
                    modal.classList.add('active');
                    overlay.classList.add('active');
                });
            });

            // ポップアップを閉じる処理
            const closeModal = () => {
                modal.classList.remove('active');
                overlay.classList.remove('active');
            };

            // 閉じるボタンか、暗い背景を押したら閉じる
            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', closeModal);
            // ========== ここまで追加 ==========
        });
    </script>








</body>

</html>
