<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規投稿 - みんなのキッチン</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./upload.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <header class="detail-header upload-header">
            <a href="index.html" class="back-button">
                <i class="fa-solid fa-xmark"></i> キャンセル
            </a>
            <h2>新規投稿</h2>
        </header>

        <main class="content upload-content">
            <input type="file" id="imageInput" accept="image/*" hidden>
            <label for="imageInput" class="upload-btn" id="uploadLabel">
                <i class="fa-solid fa-camera"></i> 写真をアップロード
            </label>

            <div class="image-wrap preview-wrap" id="previewWrap">
                <p class="pin-guide">
                    <i class="fa-solid fa-hand-pointer"></i> 画像をタップしてピンを置く
                </p>
                <img id="previewImage" class="detail-image preview-image" alt="投稿画像のプレビュー">
            </div>

            <div id="productSelectArea" class="product-select-area">
                <p>このピンに紐付ける商品：</p>
                <select id="productDropdown">
                    <option value="">商品を選択してください</option>
                </select>
                <button id="confirmPinBtn" class="cart-add-btn compact-button">ピンを確定する</button>
            </div>

            <section class="upload-form-section selected-products-section" id="selectedProductsSection" hidden>
                <h2>選択済み商品</h2>
                <div class="product-strip upload-product-strip" id="selectedProductStrip"></div>
            </section>

            <section class="upload-form-section" aria-labelledby="uploadTagsTitle">
                <h2 id="uploadTagsTitle">投稿タグ</h2>
                <p class="upload-section-guide">投稿に合うタグを1つ以上選択してください。</p>
                <div class="upload-tag-groups" id="uploadTagGroups"></div>

                <button class="add-free-tag-button" id="showFreeTagButton" type="button">
                    <span aria-hidden="true">＋</span> 自由タグを追加
                </button>
                <div class="free-tag-form" id="freeTagForm" hidden>
                    <input id="freeTagInput" type="text" maxlength="24" placeholder="自由タグを入力" aria-label="自由タグ">
                    <button id="addFreeTagButton" type="button">追加</button>
                </div>
                <div class="filter-chips free-tag-list" id="freeTagList"></div>
            </section>

            <section class="upload-form-section" aria-labelledby="uploadDescriptionTitle">
                <label for="descriptionInput">
                    <h2 id="uploadDescriptionTitle">投稿者からの説明</h2>
                </label>
                <textarea id="descriptionInput" maxlength="500" rows="6"
                    placeholder="収納の工夫やお気に入りのポイントなどを自由に入力してください。"></textarea>
            </section>
        </main>

        <div class="bottom-action">
            <button id="submitBtn" class="cart-add-btn submit-button" disabled>この内容で投稿する</button>
        </div>
    </div>

    <script type="module" src="./src/upload.js"></script>
</body>

</html>
