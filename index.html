<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果 - みんなのキッチン</title>
    <!-- CSSの読み込み -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome（アイコン用）の読み込み -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- スマホ画面の枠となるコンテナ -->
    <div class="app-container">

        <!-- ヘッダーエリア -->
        <header class="header">
            <!-- 検索窓 -->
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" value="フライパン" readonly>
            </div>

            <!-- タブ -->
            <div class="tabs">
                <div class="tab">商品一覧</div>
                <div class="tab active">みんなのキッチン</div>
            </div>
        </header>

        <!-- コンテンツエリア（画像グリッド） -->
        <main class="content">
            <div class="image-grid">
                <!-- 画像1 (クリックで detail.html へ遷移) -->
                <a href="detail.html?img=kitchen1.jpg" class="grid-item">
                    <img src="./images/kitchen1.jpg" alt="キッチン画像1">
                </a>
                <!-- 画像2 -->
                <a href="detail.html?img=kitchen2.jpg" class="grid-item">
                    <img src="./images/kitchen2.jpg" alt="キッチン画像2">
                </a>
                <!-- 画像3 -->
                <a href="detail.html?img=kitchen3.jpg" class="grid-item">
                    <img src="./images/kitchen3.jpg" alt="キッチン画像3">
                </a>
            </div>
        </main>

        <!-- ボトムナビゲーション -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i></a>
            <a href="#" class="nav-item"><i class="fa-regular fa-compass"></i></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-cart-shopping"></i></a>
            <a href="#" class="nav-item"><i class="fa-regular fa-bell"></i></a>
            <a href="#" class="nav-item"><i class="fa-regular fa-user"></i></a>
        </nav>

    </div>
</body>

</html>
