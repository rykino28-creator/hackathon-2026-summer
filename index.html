<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果 - みんなのキッチン</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <header class="header">
            <div class="search-area">
                <form class="search-bar" id="searchForm" action="index.html" method="GET">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="search" name="q" id="searchInput" placeholder="投稿タグを検索..." autocomplete="off">
                    <button class="filter-toggle" id="filterToggle" type="button" aria-label="タグで絞り込む"
                        aria-controls="filterPanel" aria-expanded="false">
                        <svg viewBox="0 0 28 24" aria-hidden="true">
                            <path d="M3 7h12M21 7h4M3 17h4M13 17h12"></path>
                            <circle cx="18" cy="7" r="3"></circle>
                            <circle cx="10" cy="17" r="3"></circle>
                        </svg>
                    </button>
                </form>

                <div class="filter-overlay" id="filterOverlay" hidden></div>

                <section class="filter-panel" id="filterPanel" role="dialog" aria-modal="true"
                    aria-label="タグの絞り込み" hidden>
                    <button class="filter-chip favorite-filter" id="favoriteFilter" type="button"
                        aria-pressed="false"></button>
                    <div id="filterGroups"></div>
                    <button class="filter-clear" id="filterClear" type="button" hidden>選択をすべて解除</button>
                    <button class="filter-apply" id="filterApply" type="button">この条件で検索</button>
                </section>
            </div>

            <div class="tabs">
                <div class="tab">商品一覧</div>
                <div class="tab active">みんなのキッチン</div>
            </div>
        </header>

        <main class="content">
            <p class="search-summary" id="searchSummary" aria-live="polite"></p>
            <div class="image-grid" id="imageGrid"></div>
        </main>

        <nav class="bottom-nav" aria-label="メインナビゲーション">
            <a href="#" class="nav-item active" aria-label="ホーム"><i class="fa-solid fa-house"></i></a>
            <a href="upload.html" class="nav-item" aria-label="新規投稿"><i class="fa-solid fa-circle-plus"></i></a>
            <a href="cart.html" class="nav-item" aria-label="カート"><i class="fa-solid fa-cart-shopping"></i></a>
            <a href="#" class="nav-item" aria-label="通知"><i class="fa-regular fa-bell"></i></a>
            <a href="#" class="nav-item" aria-label="プロフィール"><i class="fa-regular fa-user"></i></a>
        </nav>
    </div>

    <script type="module" src="./src/index.js"></script>
</body>

</html>
