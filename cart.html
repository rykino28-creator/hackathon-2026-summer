<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カート - みんなのキッチン</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container cart-page">
        <header class="cart-header">
            <h1>カート</h1>
        </header>

        <main class="cart-content">
            <section aria-labelledby="cartProductsTitle">
                <h2 id="cartProductsTitle">カートの商品</h2>
                <div class="cart-product-list" id="cartProductList"></div>
                <p class="cart-empty" id="cartProductEmpty" hidden>
                    カートに商品はまだありません。<br>
                    投稿詳細から商品を追加できます。
                </p>
            </section>
        </main>

        <div class="cart-order-bar">
            <button class="checkout-button" id="orderButton" type="button">注文に進む</button>
        </div>

        <nav class="bottom-nav" aria-label="メインナビゲーション">
            <a href="index.html" class="nav-item" aria-label="ホーム"><i class="fa-solid fa-house"></i></a>
            <a href="upload.html" class="nav-item" aria-label="新規投稿"><i class="fa-solid fa-circle-plus"></i></a>
            <a href="cart.html" class="nav-item active" aria-label="カート" aria-current="page"><i
                    class="fa-solid fa-cart-shopping"></i></a>
            <a href="#" class="nav-item" aria-label="通知"><i class="fa-regular fa-bell"></i></a>
            <a href="#" class="nav-item" aria-label="プロフィール"><i class="fa-regular fa-user"></i></a>
        </nav>
    </div>

    <script type="module" src="./src/cart.js"></script>
</body>

</html>
