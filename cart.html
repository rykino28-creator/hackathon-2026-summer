<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カート - みんなのキッチン</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container cart-page">
        <header class="cart-header">
            <h1>カート</h1>
        </header>

        <main class="cart-content">
            <section aria-labelledby="favoriteProductsTitle">
                <h2 id="favoriteProductsTitle">お気に入り商品</h2>
                <p class="cart-guide">気になる商品を選んでカートに追加できます。</p>
                <div class="favorite-product-list" id="favoriteProductList"></div>
                <p class="cart-empty" id="favoriteProductEmpty" hidden>
                    お気に入り商品はまだありません。投稿詳細の☆から追加できます。
                </p>
            </section>
        </main>

        <div class="selection-panel cart-selection-panel" id="selectionPanel">
            <div class="selected-products" id="selectedProducts"></div>
            <button class="selection-summary" id="selectionSummary" type="button" aria-expanded="false">
                <span><strong id="selectedCount">0点</strong>を選択中</span>
                <span class="selected-total" id="selectedTotal">合計 0円</span>
                <span class="selection-chevron" id="selectionChevron" aria-hidden="true">⌃</span>
            </button>
            <button class="checkout-button" id="checkoutButton" type="button" disabled>カートに追加</button>
        </div>

        <nav class="bottom-nav" aria-label="メインナビゲーション">
            <a href="index.html" class="nav-item" aria-label="ホーム"><i class="fa-solid fa-house"></i></a>
            <a href="upload.html" class="nav-item" aria-label="新規投稿"><i class="fa-solid fa-circle-plus"></i></a>
            <a href="cart.html" class="nav-item active" aria-label="カート" aria-current="page"><i
                    class="fa-solid fa-cart-shopping"></i></a>
            <a href="#" class="nav-item" aria-label="通知"><i class="fa-regular fa-bell"></i></a>
            <a href="#" class="nav-item" aria-label="プロフィール"><i class="fa-regular fa-user"></i></a>
        </nav>
    </div>

    <script type="module" src="./src/cart.js"></script>
</body>

</html>
